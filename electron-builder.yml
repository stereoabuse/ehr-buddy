appId: com.ehrbuddy.app
productName: EHR Buddy
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: dist

asar: true
asarUnpack:
  - "**/better-sqlite3/prebuilds/*.node"
  - "**/pdfkit/**"

# better-sqlite3 ships N-API prebuilds that work in any Electron, so nothing
# needs compiling at package time.
npmRebuild: false

afterPack: ./scripts/combined-afterpack.cjs

files:
  - out/**/*
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,ts,map}"

mac:
  target: dmg
  files:
    - "!node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*.node"
  category: public.app-category.medical
  identity: "-"
  hardenedRuntime: true
  # TODO(user): real distribution needs Developer ID signing + notarization
  # (set a real `identity`, provide notarize credentials). Ad-hoc signing ("-")
  # plus hardenedRuntime is sufficient for local/unsigned testing only.

win:
  files:
    - "!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl,win32-arm64}*.node"
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Uninstaller does NOT remove userData (ehrbuddy.db) — PHI is preserved
