<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle top shine -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#shine)"/>

  <!-- Clipboard body -->
  <rect x="136" y="140" width="240" height="280" rx="20" ry="20" fill="white" opacity="0.95"/>

  <!-- Clipboard clip at top -->
  <rect x="196" y="112" width="120" height="56" rx="12" ry="12" fill="white" opacity="0.95"/>
  <rect x="220" y="100" width="72" height="32" rx="16" ry="16" fill="#1D4ED8" opacity="0.7"/>

  <!-- Heart symbol on clipboard -->
  <g transform="translate(256, 280)">
    <path d="M0 30 C0 30 -52 -8 -52 -32 C-52 -52 -32 -64 -16 -56 C-6 -50 0 -40 0 -40 C0 -40 6 -50 16 -56 C32 -64 52 -52 52 -32 C52 -8 0 30 0 30Z"
          fill="#EF4444" opacity="0.85"/>
  </g>

  <!-- Horizontal lines (medical notes) -->
  <rect x="172" y="340" width="168" height="8" rx="4" fill="#3B82F6" opacity="0.3"/>
  <rect x="172" y="366" width="140" height="8" rx="4" fill="#3B82F6" opacity="0.25"/>
  <rect x="172" y="392" width="152" height="8" rx="4" fill="#3B82F6" opacity="0.2"/>
</svg>
